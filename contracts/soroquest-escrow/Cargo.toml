[package]
name = "soroquest-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "21.0.0" }
ed25519-dalek = { version = "=2.2.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
ed25519-dalek = { version = "=2.2.0" }

[features]
testutils = ["soroban-sdk/testutils"]
